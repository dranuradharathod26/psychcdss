const PRESENTATIONS = ["depression", "selfharm", "personality", "anxiety", "sleep", "addiction", "adhd", "edpme"];

function visibleQuestions(presentation, answers) {
  let qs = [...BACKBONE, ...((MODULES[presentation] && MODULES[presentation].questions) || [])];
  const wantsSelfHarm = presentation === "selfharm" || answers.recentSelfHarm === "Yes";
  if (wantsSelfHarm) qs = qs.concat(SELFHARM);
  return qs.filter((q) => !q.showIf || q.showIf(answers));
}

function computeFlags(answers) {
  const flags = [];
  const add = (level, text) => flags.push({ level, text });
  if (answers.currentSI === "Active, with plan") add("critical", "Active suicidal ideation with a plan");
  if (answers.recentSelfHarm === "Yes" && (answers.currentSI === "Active, no plan" || answers.currentSI === "Active, with plan"))
    add("critical", "Recent self-harm with ongoing active ideation");
  if (answers.shCurrentPlan === "Yes") add("critical", "Current suicidal plan disclosed");
  if (answers.accessToMeans === "Yes" && (answers.currentSI && answers.currentSI.startsWith("Active") || answers.recentSelfHarm === "Yes"))
    add("critical", "Access to means with elevated risk");
  if (answers.odOwnMed === "Yes") add("critical", "Own psychiatric medication used in overdose — review access/supervision before any refill");
  if (answers.psychoticFeatures === "Yes") add("critical", "Psychotic features present");
  if (answers.bipolarEpisodes === "Yes" || answers.sleepBipolarEpisodes === "Yes" || answers.backboneBipolarScreen === "Yes")
    add("moderate", "Possible bipolarity — screen before escalating antidepressant treatment");
  if (answers.shAgitation === "Yes") add("moderate", "Current agitation/mania/psychosis alongside self-harm history");
  if (answers.shCollaborate === "No") add("moderate", "Patient unable to collaborate with safety planning");
  if (answers.shFollowUp === "No") add("moderate", "No reliable follow-up currently available");
  if (answers.anxOCDFlag === "Yes") add("moderate", "OCD phenomenology present — consider OCD-specific assessment");
  if (answers.anxTraumaFlag === "Yes") add("moderate", "Trauma-linked onset — consider PTSD-specific assessment");
  if (answers.addWithdrawalRisk === "Yes") add("critical", "Possible need for medically supervised withdrawal management");
  if (answers.addOverdoseHistory === "Yes") add("moderate", "History of substance overdose");
  if (answers.adhdCardiacHx === "Yes") add("critical", "Cardiac history reported — screen before stimulant initiation");
  if (answers.adhdBipolarPsychosisHx === "Yes") add("critical", "Bipolar/psychotic history — screen before stimulant initiation");
  if (answers.adhdMisuseRisk === "Yes") add("critical", "Misuse/diversion risk signs — caution before prescribing stimulants");
  if (answers.persTraits && answers.persTraits.length > 0 && !answers.persTraits.includes("None of these — appears reactive to current stressor only") && answers.persEpisodeVsTrait === "Confined to current episode")
    add("moderate", "Traits marked but instability appears episode-confined — avoid attributing to a personality disorder without longitudinal history");
  if (answers.persEpisodeVsTrait === "Longstanding pattern predating episode" && answers.persPervasiveness === "Yes")
    add("moderate", "Possible longstanding personality pattern — needs corroboration over time, not a single-visit diagnosis");
  if (answers.edpmeMedTemporal === "Yes") add("moderate", "Possible medication-induced sexual dysfunction — review temporal link before changing psychiatric treatment");
  if (answers.edpmeConcern && answers.edpmeConcern.includes("Erectile dysfunction") && answers.edpmeMorningErections === "No" && answers.edpmeSituational === "Generalized")
    add("moderate", "Pattern suggests possible organic contribution — consider medical/vascular workup");
  if (answers.edpmeVascularRisk && answers.edpmeVascularRisk.length > 0 && !answers.edpmeVascularRisk.includes("None identified"))
    add("moderate", "Vascular risk factors present — erectile dysfunction can be an early marker of cardiovascular disease");
  return flags;
}

function isAnswered(q, answers) {
  const v = answers[q.id];
  if (v === undefined || v === null) return false;
  if (Array.isArray(v)) return v.length > 0;
  return String(v).trim().length > 0;
}

function parseDashboard(text) {
  const lines = text.split("\n").map((l) => l.trim()).filter((l) => l.length > 0);
  const headerRegex = /^[A-Z][A-Z /()'-]*:$/;
  const sections = [];
  let current = null;
  lines.forEach((line) => {
    if (headerRegex.test(line)) {
      current = { header: line.replace(/:$/, ""), bullets: [] };
      sections.push(current);
    } else {
      const clean = line.replace(/^[-•]\s*/, "");
      if (!current) { current = { header: "", bullets: [] }; sections.push(current); }
      current.bullets.push(clean);
    }
  });
  return sections;
}

function parseGapCheck(text) {
  let extracted = {};
  let gaps = [];
  const extractedMatch = text.match(/EXTRACTED:\s*([\s\S]*?)(?=STILL ASK:|$)/i);
  const stillAskMatch = text.match(/STILL ASK:\s*([\s\S]*)/i);
  if (extractedMatch) { try { extracted = JSON.parse(extractedMatch[1].trim()); } catch (e) { extracted = {}; } }
  if (stillAskMatch) {
    gaps = stillAskMatch[1].split("\n").map((l) => l.trim()).filter((l) => l.startsWith("-")).map((l) => l.replace(/^-\s*/, ""));
  }
  return { extracted, gaps };
}

async function callClaude(apiKey, system, userContent) {
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: MODEL,
      max_tokens: 1000,
      system,
      messages: [{ role: "user", content: userContent }],
    }),
  });
  if (!response.ok) {
    const errText = await response.text();
    throw new Error(`API error ${response.status}: ${errText.slice(0, 200)}`);
  }
  const data = await response.json();
  return (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n");
}

                    React.createElement("div", { style: { display: "flex", justifyContent: "space-between", marginBottom: 8 } },
                      React.createElement("div", { style: { color: critical, fontSize: 12 } }, "Still ask about"),
                      React.createElement("button", { onClick: speakGaps, style: { background: "transparent", border: "none", color: "rgba(0,0,0,0.5)", fontSize: 12, cursor: "pointer" } }, "🔊 Read aloud")
                    ),
                    React.createElement("ul", { style: { margin: 0, padding: 0, listStyle: "none", display: "flex", flexDirection: "column", gap: 6 } },
                      gaps.map((g, i) => React.createElement("li", { key: i, style: { display: "flex", gap: 8, fontSize: 14 } },
                        React.createElement("span", { style: { color: critical } }, "—"),
                        React.createElement("span", null, g)

          mode === "manual" && groups.map((g) => React.createElement("div", { key: g.title, style: { marginBottom: 32 } },
            React.createElement("div", { style: { fontSize: 12, color: "rgba(0,0,0,0.4)", marginBottom: 12 } }, g.title),
            React.createElement("div", { style: { display: "flex", flexDirection: "column", gap: 20 } },
              g.items.map((q) => React.createElement("div", { key: q.id },
                React.createElement("div", { style: { display: "flex", alignItems: "flex-start", gap: 6, marginBottom: 6 } },
                  React.createElement("span", { style: { color: isAnswered(q, answers) ? accent : "rgba(0,0,0,0.2)", fontSize: 14 } }, isAnswered(q, answers) ? "●" : "○"),
                  React.createElement("span", { style: { fontSize: 14 } }, q.label),
                  q.p === 0 && React.createElement("span", { style: { color: critical, fontSize: 11, marginLeft: 4 } }, "safety")

            error && React.createElement("div", { style: { color: critical, fontSize: 13, marginBottom: 8 } }, error),
            React.createElement("button", {
              onClick: generateDashboard, disabled: loading || answeredCount === 0,

            }, loading ? React.createElement("span", { className: "spin" }, "⟳") : null, " ", loading ? "Generating..." : "Generate assessment")

          React.createElement("button", { onClick: () => setScreen("intake"), style: { background: "none", border: "none", color: "rgba(0,0,0,0.5)", fontSize: 13, marginBottom: 24, cursor: "pointer" } }, "← Back to intake"),
          React.createElement("div", { style: { display: "flex", flexDirection: "column", gap: 20 } },
            sections.map((s, i) => {
              const isTreatment = s.header === "TREATMENT CONSIDERATIONS";

              const highlighted = isTreatment || isAdvice;
              return React.createElement("div", {

              },
                s.header && React.createElement("div", {

                }, s.header),
                React.createElement("ul", { style: { margin: 0, padding: "12px 16px", listStyle: "none", display: "flex", flexDirection: "column", gap: 6 } },
                  s.bullets.map((b, j) => React.createElement("li", { key: j, style: { display: "flex", gap: 8, fontSize: 13.5 } },
                    React.createElement("span", { style: { color: isAdvice ? "#8A6414" : accent } }, "—"),
